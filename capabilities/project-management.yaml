naftiko: 1.0.0-alpha2
info:
  label: SourceForge Project Management
  description: Unified capability for managing open source projects on SourceForge. Enables project maintainers, contributors,
    and community managers to programmatically manage issues, wikis, discussions, blogs, and repository webhooks through the
    SourceForge Allura REST API.
  tags:
  - SourceForge
  - Open Source
  - Project Management
  - Issue Tracking
  - Wiki
  - Collaboration
  - Developer Tools
  created: '2026-05-02'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    SOURCEFORGE_BEARER_TOKEN: SOURCEFORGE_BEARER_TOKEN
capability:
  consumes:
  - type: http
    namespace: sourceforge-api
    baseUri: https://sourceforge.net
    description: SourceForge Allura REST API for project management
    authentication:
      type: bearer
      token: '{{SOURCEFORGE_BEARER_TOKEN}}'
    resources:
    - name: projects
      path: /rest/p/{project}
      description: Project management
      operations:
      - name: get-project
        method: GET
        description: Retrieve details for a SourceForge project
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
          description: Project shortname
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-project
        method: POST
        description: Create a new SourceForge project
        body:
          type: json
          data:
            shortname: '{{tools.shortname}}'
            name: '{{tools.name}}'
            description: '{{tools.description}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: tracker
      path: /rest/p/{project}/{tracker}
      description: Issue and ticket tracking
      operations:
      - name: list-tickets
        method: GET
        description: List all tickets in the project tracker
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: tracker
          in: path
          type: string
          required: true
          description: Tracker tool mount point
        - name: page
          in: query
          type: integer
          required: false
        - name: limit
          in: query
          type: integer
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-ticket
        method: POST
        description: Create a new issue or ticket
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: tracker
          in: path
          type: string
          required: true
        body:
          type: json
          data:
            ticket_form.summary: '{{tools.summary}}'
            ticket_form.description: '{{tools.description}}'
            ticket_form.status: '{{tools.status}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-ticket
        method: GET
        description: Get ticket details by number
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: tracker
          in: path
          type: string
          required: true
        - name: ticketNumber
          in: path
          type: integer
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: search-tickets
        method: GET
        description: Search tickets with filtering
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: tracker
          in: path
          type: string
          required: true
        - name: q
          in: query
          type: string
          required: false
          description: Search query string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: wiki
      path: /rest/p/{project}/{wiki}
      description: Wiki page management
      operations:
      - name: list-wiki-pages
        method: GET
        description: List all wiki pages for a project
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: wiki
          in: path
          type: string
          required: true
          description: Wiki tool mount point
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-wiki-page
        method: GET
        description: Retrieve a specific wiki page by title
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: wiki
          in: path
          type: string
          required: true
        - name: title
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: webhooks
      path: /rest/p/{project}/admin/{tool}/webhooks
      description: Webhook management for repository events
      operations:
      - name: list-webhooks
        method: GET
        description: List all webhooks for a project tool
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: tool
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: sourceforge-project-mgmt-api
    description: Unified REST API for SourceForge open source project management.
    resources:
    - path: /v1/projects/{project}
      name: projects
      description: Project information and management
      operations:
      - method: GET
        name: get-project
        description: Get details for a SourceForge project
        call: sourceforge-api.get-project
        with:
          project: rest.project
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/projects/{project}/tickets
      name: tickets
      description: Issue and bug tracking
      operations:
      - method: GET
        name: list-tickets
        description: List all tickets in the project tracker
        call: sourceforge-api.list-tickets
        with:
          project: rest.project
          tracker: rest.tracker
          page: rest.page
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-ticket
        description: Create a new issue or bug report
        call: sourceforge-api.create-ticket
        with:
          project: rest.project
          tracker: rest.tracker
          summary: rest.summary
          description: rest.description
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/projects/{project}/tickets/search
      name: ticket-search
      description: Ticket search
      operations:
      - method: GET
        name: search-tickets
        description: Search tickets with query filtering
        call: sourceforge-api.search-tickets
        with:
          project: rest.project
          tracker: rest.tracker
          q: rest.q
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/projects/{project}/wiki
      name: wiki
      description: Wiki page access
      operations:
      - method: GET
        name: list-wiki-pages
        description: List all wiki pages for a project
        call: sourceforge-api.list-wiki-pages
        with:
          project: rest.project
          wiki: rest.wiki
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/projects/{project}/wiki/{title}
      name: wiki-page
      description: Individual wiki page
      operations:
      - method: GET
        name: get-wiki-page
        description: Get a specific wiki page by title
        call: sourceforge-api.get-wiki-page
        with:
          project: rest.project
          wiki: rest.wiki
          title: rest.title
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/projects/{project}/webhooks
      name: webhooks
      description: Repository webhook management
      operations:
      - method: GET
        name: list-webhooks
        description: List webhooks for a project tool
        call: sourceforge-api.list-webhooks
        with:
          project: rest.project
          tool: rest.tool
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: sourceforge-project-mgmt-mcp
    transport: http
    description: MCP server for AI-assisted SourceForge open source project management.
    tools:
    - name: get-project-info
      description: Get details about a SourceForge project including its description, tools, and metadata. Use to understand
        a project before performing operations.
      hints:
        readOnly: true
        openWorld: true
      call: sourceforge-api.get-project
      with:
        project: tools.project
      outputParameters:
      - type: object
        mapping: $.
    - name: list-project-issues
      description: List all issues and bug reports in a project tracker. Use for project health assessment and triage workflows.
      hints:
        readOnly: true
        openWorld: false
      call: sourceforge-api.list-tickets
      with:
        project: tools.project
        tracker: tools.tracker
        page: tools.page
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: search-project-issues
      description: Search issues in a project tracker with text queries. Use to find specific bugs, features, or tickets by
        keyword.
      hints:
        readOnly: true
        openWorld: false
      call: sourceforge-api.search-tickets
      with:
        project: tools.project
        tracker: tools.tracker
        q: tools.query
      outputParameters:
      - type: object
        mapping: $.
    - name: create-project-issue
      description: Create a new bug report or feature request in a project tracker. Use for automated issue filing from monitoring
        systems or CI/CD pipelines.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: sourceforge-api.create-ticket
      with:
        project: tools.project
        tracker: tools.tracker
        summary: tools.summary
        description: tools.description
        status: tools.status
      outputParameters:
      - type: object
        mapping: $.
    - name: get-wiki-page
      description: Retrieve a specific wiki page from a project. Use to read project documentation, installation guides, or
        release notes.
      hints:
        readOnly: true
        openWorld: true
      call: sourceforge-api.get-wiki-page
      with:
        project: tools.project
        wiki: tools.wiki
        title: tools.title
      outputParameters:
      - type: object
        mapping: $.
    - name: list-wiki-pages
      description: List all wiki pages for a project. Use to discover available documentation and project resources.
      hints:
        readOnly: true
        openWorld: false
      call: sourceforge-api.list-wiki-pages
      with:
        project: tools.project
        wiki: tools.wiki
      outputParameters:
      - type: object
        mapping: $.
    - name: list-project-webhooks
      description: List webhooks configured for a project tool. Use to audit repository integrations and CI/CD pipeline connections.
      hints:
        readOnly: true
        openWorld: false
      call: sourceforge-api.list-webhooks
      with:
        project: tools.project
        tool: tools.tool
      outputParameters:
      - type: object
        mapping: $.
