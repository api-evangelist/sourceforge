aid: sourceforge
name: SourceForge
description: >-
  SourceForge is a web-based platform for hosting, managing, and distributing open source software projects. Built on
  the Apache Allura platform, SourceForge provides project management tools including wiki, issue tracking, discussion
  forums, blogs, file releases, code repositories (Git, SVN, Mercurial), and a REST API for programmatic access to all
  project resources.
