apis:
- aid: sourceforge:allura-api
  name: Allura API
  tags:
  - Projects
  - Repositories
  - Tickets
  - Discussion
  - Open Source
  image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
  baseURL: https://sourceforge.net/rest
  humanURL: https://sourceforge.net/p/forge/documentation/Allura%20API/
  properties:
  - url: https://sourceforge.net/p/forge/documentation/Allura%20API/
    type: Documentation
  description: >-
    The Allura API is a REST API provided by SourceForge that enables developers
    to programmatically interact with SourceForge projects and their tools. The
    API exposes resources for projects, user accounts, neighborhoods, and project
    tools including Git and SVN repositories, ticket trackers, discussion forums,
    and wiki pages. Responses are returned in JSON format. Authentication is
    handled via OAuth 1.0a for write operations, while many read endpoints are
    publicly accessible without credentials. The API base URL is
    https://sourceforge.net/rest and follows RESTful conventions with resource
    paths mapped to project neighborhoods and tool mount points.
